name: ESP32-C6 Test Firmware CI

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & merge (ESP-IDF v5.4 / esp32c6)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Actions 的 container: 会绕过镜像 entrypoint，export.sh 不会自动加载
      - name: Setup IDF environment
        run: |
          set -e
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          IDF_DIR=""
          for p in /opt/esp/idf /esp/idf /opt/esp-idf /idf "$HOME/esp/esp-idf"; do
            if [ -f "$p/export.sh" ]; then IDF_DIR="$p"; break; fi
          done
          if [ -z "$IDF_DIR" ]; then
            echo "!! export.sh not found"; find / -maxdepth 5 -name export.sh 2>/dev/null | head; exit 1
          fi
          echo "IDF_DIR=$IDF_DIR"
          echo "IDF_PATH=$IDF_DIR" >> "$GITHUB_ENV"
          printf '#!/bin/bash\n. %s/export.sh >/dev/null 2>&1\n' "$IDF_DIR" > /opt/idfenv.sh
          chmod +x /opt/idfenv.sh
          . /opt/idfenv.sh
          {
            echo "IDF_DIR=$IDF_DIR"
            echo "idf.py -> $(command -v idf.py)"
            idf.py --version
            echo "gcc -> $(command -v riscv32-esp-elf-gcc)"
          } > /opt/build.log 2>&1
          cat /opt/build.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set +e
          . /opt/idfenv.sh
          {
            echo "=== set-target ==="
            idf.py set-target esp32c6
            echo "set-target rc=$?"
            echo "=== build ==="
            idf.py build
            echo "build rc=$?"
            echo "=== size ==="
            idf.py size
          } >> /opt/build.log 2>&1
          tail -c 8000 /opt/build.log

      # 用独立临时仓库推送日志，避免 orphan 分支与工作区互相干扰
      - name: Publish build log
        if: always()
        run: |
          set +e
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          rm -rf .git
          git init -q .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-logs
          cp /opt/build.log ./build.log
          ls -lh build.log
          git add -f build.log
          git commit -q -m "ci-log run ${GITHUB_RUN_ID}"
          git push -f -q https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git ci-logs
          echo "log published rc=$?"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FAILED"
          exit 1

      - name: Merge into single flash image
        run: |
          set -e
          . /opt/idfenv.sh
          cd build
          APP=$(ls *.bin | grep -v -E 'bootloader|partition' | head -1)
          echo "app = $APP"
          esptool.py --chip esp32c6 merge-bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o ../esp32c6-test-fw-merged.bin \
            0x0    bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 "$APP"
          cd ..
          ls -lh esp32c6-test-fw-merged.bin
          sha256sum esp32c6-test-fw-merged.bin

      - name: Upload merged firmware (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-test-fw-merged
          path: esp32c6-test-fw-merged.bin
          if-no-files-found: error

      - name: Publish firmware to branch
        run: |
          set -e
          mkdir -p /tmp/fwrepo && cd /tmp/fwrepo
          rm -rf .git fw
          git init -q .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b firmware
          mkdir -p fw && cd fw
          cp "$GITHUB_WORKSPACE/esp32c6-test-fw-merged.bin" firmware.bin
          sha256sum firmware.bin > SHA256SUMS
          stat -c '%s' firmware.bin > SIZE
          split -b 700k -d -a 3 firmware.bin firmware.bin.part-
          rm firmware.bin
          ls -lh
          cd ..
          git add -f fw
          git commit -q -m "firmware ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          git push -f -q https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git firmware
          echo "firmware published"

name: ESP32-C6 Test Firmware CI

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & merge (ESP-IDF v5.4 / esp32c6)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Actions 的 container: 会绕过镜像 entrypoint，export.sh 不会自动加载，
      # 必须显式探测 IDF 安装位置并生成可复用的环境脚本
      - name: Setup IDF environment
        run: |
          set -e
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          IDF_DIR=""
          for p in /opt/esp/idf /esp/idf /opt/esp-idf /idf "$HOME/esp/esp-idf"; do
            if [ -f "$p/export.sh" ]; then IDF_DIR="$p"; break; fi
          done
          if [ -z "$IDF_DIR" ]; then
            echo "!! export.sh not found, searching..."
            find / -maxdepth 5 -name export.sh 2>/dev/null | head -10 || true
            echo "!! IDF_PATH=$IDF_PATH ; PATH=$PATH"
            exit 1
          fi
          echo "IDF_DIR=$IDF_DIR"
          echo "IDF_PATH=$IDF_DIR" >> "$GITHUB_ENV"
          printf '#!/bin/bash\n. %s/export.sh >/dev/null 2>&1\n' "$IDF_DIR" > /opt/idfenv.sh
          chmod +x /opt/idfenv.sh
          . /opt/idfenv.sh
          {
            echo "--- env ---"
            echo "IDF_DIR=$IDF_DIR"
            echo "idf.py -> $(command -v idf.py)"
            idf.py --version
            echo "riscv gcc -> $(command -v riscv32-esp-elf-gcc)"
          } 2>&1 | tee build.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          . /opt/idfenv.sh
          {
            idf.py set-target esp32c6
            idf.py build
            idf.py size
          } 2>&1 | tee -a build.log

      - name: Publish build log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'
          git checkout --orphan ci-logs
          git rm -rf . --quiet || true
          cp "$GITHUB_WORKSPACE/build.log" ./build.log 2>/dev/null || echo "no build.log"
          ls -lh build.log 2>/dev/null || true
          git add -f build.log 2>/dev/null || true
          git commit -q -m "ci-log run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push -f origin ci-logs || echo "push failed"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FAILED"
          exit 1

      - name: Merge into single flash image
        run: |
          set -e
          . /opt/idfenv.sh
          cd build
          APP=$(ls *.bin | grep -v -E 'bootloader|partition' | head -1)
          echo "app = $APP"
          esptool.py --chip esp32c6 merge-bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o ../esp32c6-test-fw-merged.bin \
            0x0    bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 "$APP"
          cd ..
          ls -lh esp32c6-test-fw-merged.bin
          sha256sum esp32c6-test-fw-merged.bin

      - name: Upload merged firmware (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-test-fw-merged
          path: esp32c6-test-fw-merged.bin
          if-no-files-found: error

      - name: Publish firmware to orphan branch
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'
          git checkout --orphan firmware
          git rm -rf . --quiet || true
          rm -rf .github main build CMakeLists.txt README.md sdkconfig.defaults
          mkdir -p fw
          cp esp32c6-test-fw-merged.bin fw/firmware.bin
          cd fw
          split -b 700k -d -a 3 firmware.bin firmware.bin.part-
          rm firmware.bin
          sha256sum firmware.bin.part-* > SHA256SUMS
          ls -lh
          cd ..
          git add -f fw
          git commit -q -m "firmware: ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -f origin firmware
          echo "published"

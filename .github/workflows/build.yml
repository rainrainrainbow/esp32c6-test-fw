name: ESP32-C6 Test Firmware CI

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & merge (ESP-IDF v5.4 / esp32c6)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 容器内 uid 与 checkout 属主不一致，git 会报 dubious ownership，
      # 而 idf.py 内部会调用 git describe —— 必须先放行，否则直接失败
      - name: Trust workspace for git
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory /__w
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "safe.directory ok"
          git --version

      - name: Show environment
        run: |
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version
          echo "CONFIG target file:"
          cat sdkconfig.defaults || true

      # 直接在 build 阶段生成 sdkconfig（sdkconfig.defaults 已指定 esp32c6），
      # 不再单独跑 set-target，少一个失败点
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          idf.py build 2>&1 | tee build.log

      - name: Publish build log (for remote inspection)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'
          git checkout --orphan ci-logs
          git rm -rf . --quiet || true
          cp /__w/esp32c6-test-fw/esp32c6-test-fw/build.log . 2>/dev/null || \
            cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no build.log"
          ls -lh build.log 2>/dev/null || true
          git add -f build.log 2>/dev/null || true
          git commit -q -m "ci-log run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push -f origin ci-logs || echo "push failed"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FAILED"
          exit 1

      - name: Size report
        run: idf.py size

      - name: Merge into single flash image
        run: |
          cd build
          APP=$(ls *.bin | grep -v -E 'bootloader|partition' | head -1)
          echo "app = $APP"
          esptool.py --chip esp32c6 merge-bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o ../esp32c6-test-fw-merged.bin \
            0x0    bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 "$APP"
          cd ..
          ls -lh esp32c6-test-fw-merged.bin
          sha256sum esp32c6-test-fw-merged.bin

      - name: Upload merged firmware (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-test-fw-merged
          path: esp32c6-test-fw-merged.bin
          if-no-files-found: error

      - name: Publish firmware to orphan branch
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'
          git checkout --orphan firmware
          git rm -rf . --quiet || true
          rm -rf .github main build CMakeLists.txt README.md sdkconfig.defaults
          mkdir -p fw
          cp esp32c6-test-fw-merged.bin fw/firmware.bin
          cd fw
          split -b 700k -d -a 3 firmware.bin firmware.bin.part-
          rm firmware.bin
          sha256sum firmware.bin.part-* > SHA256SUMS
          ls -lh
          cd ..
          git add -f fw
          git commit -q -m "firmware: ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -f origin firmware
          echo "published"

name: ESP32-C6 Test Firmware CI

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (ESP-IDF v5.4 / esp32c6)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup IDF environment
        run: |
          set -e
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          IDF_DIR=""
          for p in /opt/esp/idf /esp/idf /opt/esp-idf /idf "$HOME/esp/esp-idf"; do
            if [ -f "$p/export.sh" ]; then IDF_DIR="$p"; break; fi
          done
          [ -n "$IDF_DIR" ] || { echo "!! export.sh not found"; exit 1; }
          echo "IDF_PATH=$IDF_DIR" >> "$GITHUB_ENV"
          printf '#!/bin/bash\n. %s/export.sh >/dev/null 2>&1\n' "$IDF_DIR" > /opt/idfenv.sh
          chmod +x /opt/idfenv.sh
          . /opt/idfenv.sh
          { echo "IDF_DIR=$IDF_DIR"; idf.py --version; } > /opt/build.log 2>&1
          cat /opt/build.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set +e
          . /opt/idfenv.sh
          {
            echo "=== driver headers diag ==="
            ls /opt/esp/idf/components 2>/dev/null | grep -i -E 'driver' || true
            find /opt/esp/idf/components -maxdepth 4 -name 'i2c.h'       2>/dev/null | head -5
            find /opt/esp/idf/components -maxdepth 4 -name 'i2s_std.h'   2>/dev/null | head -5
            find /opt/esp/idf/components -maxdepth 4 -name 'spi_master.h' 2>/dev/null | head -5
            find /opt/esp/idf/components -maxdepth 4 -name 'ledc.h'      2>/dev/null | head -5
            echo "=== set-target ==="
            idf.py set-target esp32c6
            echo "set-target rc=$?"
            echo "=== build ==="
            idf.py build
            echo "build rc=$?"
            echo "=== size ==="
            idf.py size
            echo "size rc=$?"
          } >> /opt/build.log 2>&1
          tail -c 8000 /opt/build.log
          # 显式判定：set +e 会让 tail 的退出码掩盖真实构建结果
          if grep -q "^build rc=0" /opt/build.log; then
            echo "BUILD_RESULT=OK"
          else
            echo "BUILD_RESULT=FAILED"
            exit 1
          fi

      - name: Collect binaries
        id: collect
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          . /opt/idfenv.sh
          rm -rf /tmp/fwrepo && mkdir -p /tmp/fwrepo && cd /tmp/fwrepo
          cp "$GITHUB_WORKSPACE/build/bootloader/bootloader.bin"      bootloader.bin
          cp "$GITHUB_WORKSPACE/build/partition_table/partition-table.bin" partition-table.bin
          APP=$(ls "$GITHUB_WORKSPACE"/build/*.bin | grep -v -E 'bootloader|partition' | head -1)
          echo "APP=$APP"
          cp "$APP" app.bin
          printf 'bootloader.bin\t0x0\npartition-table.bin\t0x8000\napp.bin\t0x10000\n' > offsets.txt
          for f in *.bin; do
            sz=$(stat -c %s "$f")
            echo "$f size=$sz"
            if [ "$sz" -gt 900000 ]; then
              split -b 700k -d -a 3 "$f" "$f.part-"
              rm "$f"
            fi
          done
          sha256sum * > SHA256SUMS 2>/dev/null
          ls -lh

      - name: Publish via Git Data API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          mkdir -p /tmp/logdir
          cp /opt/build.log /tmp/logdir/build.log 2>/dev/null || echo "no log" > /tmp/logdir/build.log
          # 先推固件（错误会写进 build.log），再推日志
          python3 ci_publish.py firmware /tmp/fwrepo >> /opt/build.log 2>&1 || \
            echo "firmware publish FAILED" >> /opt/build.log
          cp /opt/build.log /tmp/logdir/build.log
          python3 ci_publish.py ci-logs /tmp/logdir >> /opt/build.log 2>&1 || \
            echo "log publish FAILED" >> /opt/build.log
          echo "publish stage done"

      - name: Upload raw binaries (Artifact)
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-test-fw-raw
          path: /tmp/fwrepo
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FAILED"
          exit 1
